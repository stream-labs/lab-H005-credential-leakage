# LAB VICTIM (H005) — credential leakage via artifact. checkout persists the
# GITHUB_TOKEN into .git/config (persist-credentials defaults true); uploading the
# workspace (including .git/) packs that token into a downloadable artifact.
name: Lab Artifact Upload

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # persist-credentials defaults to true
      - run: git config --local --list | grep -i extraheader || true
      - uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .git/config            # the file holding the AUTHORIZATION header
          include-hidden-files: true
